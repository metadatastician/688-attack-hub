# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for 688 Attack Hub.
#
# Two ecosystems, because two is all this repo can have: github-actions (the
# workflows) and npm (package.json, which declares no dependencies at all).
#
# The RSR template shipped every common ecosystem with the instruction "remove
# unused ones for your project", and nothing ever removed them. Four were wrong
# here — two because no manifest existed, and two on policy:
#
#   Nix     — retired estate-wide in favour of Guix. Wrong in every repo, not
#             just this one, so never re-add it.
#   Python  — banned estate-wide with no exceptions. Where a real language is
#             needed the choices are Rust, Julia, AffineScript or Elixir as the
#             job demands; this repo needs none of them.
#
# An invalid ecosystem does not fail quietly in its own lane: it rejects the
# WHOLE file, so the valid entries stop updating too. Keep this list minimal
# and keep it correct.

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Node.js/npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
