# Dependabot configuration for 688 Attack Hub.
#
# Pruned to the ecosystems this repo actually has. The RSR template ships every
# common ecosystem with the instruction "remove unused ones for your project";
# nothing removed them, so `pip` and `nix` failed on every scheduled run with
# "Dependabot encountered an error performing the update" — there is no Python
# manifest and no .nix file here. `cargo` and `mix` had no manifest either.
#
# This repo is one self-contained HTML file plus a package.json whose only
# script is `python3 -m http.server`. Two ecosystems are all it can have:
# github-actions (the two workflows) and npm (package.json).
#
# Nix is retired estate-wide in favour of Guix, so a `nix` block is wrong in
# every repo, not just this one.

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Node.js/npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
